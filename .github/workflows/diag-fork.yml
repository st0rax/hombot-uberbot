name: DIAG fork.s

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-arm-linux-gnueabi libelf-dev xz-utils
      - name: build fork.s
        run: |
          set -euo pipefail
          BUILD="$RUNNER_TEMP/k"
          ROOT="$(pwd)"
          mkdir -p "$BUILD"
          git clone --depth 1 https://github.com/larixer/kernel.rk.git "$BUILD/kernel.rk"
          cd "$BUILD/kernel.rk"
          ./make_kernel.sh
          cd kernel-2.6.33
          cp ../files/arch/arm/configs/rk_hit_v2_ubif_defconfig .config
          patch -p1 < "$ROOT/tools/kernel-modern-toolchain.patch"
          grep -rl ', #alloc, #execinstr' arch/arm | while IFS= read -r s; do
            sed -i 's|, #alloc, #execinstr|, "ax", %progbits|g' "$s"
          done
          gm=$(arm-linux-gnueabi-gcc -dumpfullversion -dumpversion | cut -d. -f1)
          [ -e "include/linux/compiler-gcc${gm}.h" ] || ln -s compiler-gcc4.h "include/linux/compiler-gcc${gm}.h"
          arm-linux-gnueabi-gcc --version | head -1
          set +o pipefail
          yes "" | make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- oldconfig >/dev/null
          set -o pipefail
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- prepare >/dev/null 2>&1 || true
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- kernel/fork.s
          echo "=========== .ifnc / .err occurrences ==========="
          grep -n '\.ifnc' kernel/fork.s | head -40
          echo "=========== context ==========="
          awk 'NR>=830 && NR<=880 {print NR": "$0}' kernel/fork.s
